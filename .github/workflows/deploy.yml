name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build manifest (merge all buckets)
        env:
          PASSWORD: ${{ secrets.PASSWORD }}

          # ---- R2 (secrets) ----
          R2_BUCKETS: ${{ secrets.R2_BUCKETS }}                # e.g. "media-archive,media-backup"
          R2_ENDPOINTS: ${{ secrets.R2_ENDPOINTS }}            # e.g. "https://acc1...,https://acc2..."
          R2_ACCESS_KEY_IDS: ${{ secrets.R2_ACCESS_KEY_IDS }}
          R2_SECRET_ACCESS_KEYS: ${{ secrets.R2_SECRET_ACCESS_KEYS }}
          # Optional caching:
          R2_OBJECTS_CACHE: ${{ vars.R2_OBJECTS_CACHE }}
          R2_SKIP_LIST: ${{ vars.R2_SKIP_LIST }}
          # ---- Public bases (not secret) ----
          PUBLIC_MEDIA_BASES: ${{ vars.PUBLIC_MEDIA_BASES }}    # e.g. "https://worker-a.example.com/,https://worker-b.example.com/"
          # or use PUBLIC_MEDIA_BASE: ${{ vars.PUBLIC_MEDIA_BASE }}
          # Posters optional:
          ENABLE_LOCAL_POSTERS: ${{ vars.ENABLE_LOCAL_POSTERS }}
        run: node scripts/generate-manifest.js

      - name: Build site
        env:
          # Astro only needs PUBLIC_* at build/client time
          PUBLIC_MEDIA_BASES: ${{ vars.PUBLIC_MEDIA_BASES }}
          # If you prefer single:
          # PUBLIC_MEDIA_BASE: ${{ vars.PUBLIC_MEDIA_BASE }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
